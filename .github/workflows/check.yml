name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when a file named FAIL exists
        run: |
          if [ -e FAIL ]; then
            echo "A file named FAIL exists, so this check fails on purpose."
            exit 1
          fi
          echo "No FAIL file, check passes."
